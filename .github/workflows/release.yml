name: Release

# Every merge to main publishes the next patch version to GitHub Packages, tags it
# vX.Y.Z, and moves the v0 tag that workflows use (tstapleton/plotline@v0).
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push tags
      packages: write # publish to npm.pkg.github.com
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # tags, to find the last released version
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@tstapleton'
      - run: npm ci --no-audit --no-fund

      - name: Pick the next version
        id: version
        run: |
          last=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n 1)
          if [ -z "$last" ]; then
            next=0.1.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "major=${next%%.*}" >> "$GITHUB_OUTPUT"
          echo "Releasing $next (previous: ${last:-none})"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          npm publish

      - name: Tag the release
        env:
          VERSION: ${{ steps.version.outputs.next }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git tag "v$VERSION"
          git tag --force "v$MAJOR"
          git push origin "v$VERSION"
          git push --force origin "v$MAJOR"
